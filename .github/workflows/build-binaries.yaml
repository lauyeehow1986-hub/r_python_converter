name: Build Binary & Source R Package Repository

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c("gmp", "R6", "treesitter", "testthat", "pkgload", "knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Install pyrt and pyport
        run: |
          install.packages("packages/pyrt", repos = NULL, type = "source")
          install.packages("packages/pyport", repos = NULL, type = "source")
        shell: Rscript {0}

      - name: Build CRAN-structured source & binary repository
        run: |
          source("tools/build-drat-repo.R")
          build_local_cran_repo("built-repo")
        shell: Rscript {0}

      - name: Upload built R packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-packages-${{ matrix.os }}
          path: built-repo/
